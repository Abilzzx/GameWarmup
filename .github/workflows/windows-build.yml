name: Windows build and engine checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run engine checks
        run: dotnet run --project GameWarmup.Checks/GameWarmup.Checks.csproj -c Release
      - name: Compile desktop app
        run: dotnet publish GameWarmup/GameWarmup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: GameWarmup-win-x64
          path: publish/
